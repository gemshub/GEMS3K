name: GEMS3K

channels:
  - conda-forge
  - defaults

dependencies:
  - cmake>=3.16
  - git
  - gcc_linux-64  # [linux] 
  - gxx_linux-64  # [linux] 
  - sysroot_linux-64 # [linux] 
  - make  # [unix]
  - ninja
  - python>=3.10,<3.15  # autodiff 1.x has no Python 3.15 build yet
  - pip
  - pytest
  - pybind11
  - autodiff>=1.1.1
  - eigen
  - nlohmann_json
  - thermofun>=0.7.1
